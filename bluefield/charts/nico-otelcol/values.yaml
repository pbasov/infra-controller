### DPF contract ###
serviceDaemonSet:
  nodeSelector:
  labels: {}
  annotations: {}
  updateStrategy: {}
  resources: {}
exposedPorts:
  labels: {}
  ports: {}

### Cert directory + root CA filename overrides.
certsDir: /opt/forge
rootCaFile: forge_root.pem

### Service specific values ###
# Prometheus receiver port; must match DPUServiceConfiguration configPorts (dpf_services).
prometheusPort: 9999
# Host:port for prometheus scrape targets (see otel_config.yaml). DPF sets these via nico-api.
nico_dpu_agent: ""
nico_fmds: ""
nico_dts: ""
image:
  repository: ""
  pullPolicy: IfNotPresent
  tag: ""
# node-exporter sidecar: provides the host metrics scraped by the
# prometheus/node receiver in otel_config.yaml at localhost:<port>.
# It binds to loopback only, so it is never exposed on the host's external
# interfaces. Pinned public multi-arch image (includes arm64 for BlueField).
nodeExporter:
  image:
    repository: quay.io/prometheus/node-exporter
    tag: v1.9.1
    pullPolicy: IfNotPresent
  # Must match the prometheus/node scrape target (localhost:9200) in otel_config.yaml.
  port: 9200
  resources: {}
# transceiver-exporter sidecar: provides optical transceiver (DOM) metrics
# scraped by the prometheus/transceiver receiver in otel_config.yaml at
# localhost:<port>. It binds to loopback only, so it is never exposed on the
# host's external interfaces. Unlike node-exporter there is no public image, so
# it is built from the wobcom transceiver-exporter release and published
# alongside otelcol-contrib (see bluefield/containers/transceiver-exporter).
transceiverExporter:
  image:
    # Defaults to the sibling `transceiver-exporter` path next to
    # image.repository — the two are published side by side in the same registry
    # and namespace by the same CI run, so a mirrored install follows its mirror
    # automatically instead of needing a per-site extra_helm_values overlay for
    # the sidecar. NICo writes image.{repository,tag} from DpfServiceConfig
    # (crates/api-core/src/dpf_services.rs); a registry hardcoded here does not
    # follow it.
    repository: ""
    # Defaults to the otelcol-contrib image tag (built in the same CI run).
    tag: ""
    pullPolicy: IfNotPresent
  # Must match the prometheus/transceiver scrape target (localhost:9300) in otel_config.yaml.
  port: 9300
  resources: {}
imagePullSecrets: []
podSecurityContext: {}
securityContext:
  privileged: true
  runAsUser: 0
  runAsGroup: 0
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
tolerations: []
